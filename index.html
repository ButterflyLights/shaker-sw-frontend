<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Krakeelo</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="row">

    <div class="box" id="profileBox">
        <h2>Profiles</h2>
    
        <div class="table-container">
            <table id="profileTable">
        
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                    </tr>
                </thead>
        
                <tbody>
                </tbody>
        
            </table>
        </div>
    </div>
    
    <div class="box" id="profileDataBox">
        <h2>Profile Data</h2>
    
        <button class="btn" onclick="saveProfile()">
            Save Profile
        </button>
    
        <button class="btn" onclick="deleteProfile()">
            Delete Profile
        </button>

        <input type="file" id="audioFile" class="audioInput" accept="audio/*">

        <button class="btn" onclick="uploadAudio()">
            Upload Audio File
        </button>
    
        <table id="profileDataTable">
    
            <thead>
            </thead>
    
            <tbody>
            </tbody>
    
        </table>
    </div>

    <div class="box" id="measurementBox">
        <h2>Measurements</h2>
    
        <div class="table-container">
            <table id="measurementTable">
                <thead>
                    <tr>
                        <th>ID</th>
                    </tr>
                </thead>

                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <div class="box" id="currentMeasurementBox">
        <h2>Current Measurement</h2>
    
        <button class="btn" onclick="sendMeasurement()">
            Start Measurement with Selected Profile
        </button>
    
        <button class="btn" onclick="sendStop()">
            Stop Measurement
        </button>
    
        <button class="btn" onclick="downloadData()">
            Download Data
        </button>
    
        <div id="status" class="response"></div>

    </div>

    
    <div class="box" id="measurementPlot">
        <div id="inputPSD"></div>
    </div>

</div>

<div id="error" class="response"></div>

<div id="contactBox">
    <a href="">Documentation</a><br> <!-- TODO: add link -->
    <strong>Nikolai Neutze</strong><br>
    <a href="mailto:nikolai.neutze@rwth-aachen.de">
        nikolai.neutze@rwth-aachen.de
    </a><br>
    <strong>03.06.2026</strong>
    <strong>Space Team Aachen</strong><br>
</div>
  
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script type="text/javascript" src="script.js"></script>

</body>
</html>
