<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Krakeelo</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
    <h2>Profiles</h2>

    <button onclick="newProfile()">
        New Profile
    </button>

    <table id="profileTable">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
        </thead>

        <tbody>
        </tbody>

    </table>
</div>

<div class="box" id="profileDataBox">
    <h2>Profile Data</h2>

    <button onclick="saveProfile()">
        Save Profile
    </button>

    <button onclick="deleteProfile()">
        Delete Profile
    </button>

    <table id="profileDataTable">

        <thead>
        </thead>

        <tbody>
        </tbody>

    </table>
</div>

<div class="box">
    <h2>Measurement</h2>

    <button onclick="sendMeasurement()">
        Start Measurement
    </button>

    <button onclick="sendStop()">
        Stop Measurement
    </button>

    <button onclick="downloadData()">
        Download Data
    </button>

</div>

<div id="response" class="response"></div>
  
<script type="text/javascript" src="script.js"></script>

</body>
</html>
